
name: test:compress

on:
  push:
    paths:
    - 'action.yml'
    - '.github/workflows/compress.yml'
  workflow_dispatch:

jobs:
  test-run:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: idleberg/create-playdate-release@main
      with:
        dry_run: true
        input: .github/source
        output: uncompressed
        compress: false
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - uses: idleberg/create-playdate-release@main
      with:
        dry_run: true
        input: .github/source
        output: compressed
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build outputs have different file size
      run: |
        if ((`stat -c%s "uncompressed.pdx/main.pdz"` == `stat -c%s "compressed.pdx/main.pdz"`)); then
          echo "Both output files have the same size"
          exit 1
        fi
